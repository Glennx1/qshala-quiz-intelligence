name: CI

# Runs on every push, main included. Cloud Build's auto-deploy trigger fires on push to main
# with no dependency on this workflow at all -- a push straight to main (today's actual
# workflow here, no PRs in the loop) used to skip CI entirely (branches-ignore: [main] below),
# so tests never ran on the exact commits that got deployed to production. This doesn't make
# Cloud Build *wait* for CI (that would need moving the deploy into this workflow, or a Cloud
# Build trigger condition pointed at this run's status -- a bigger change, left for later if
# worth it) -- it just means a broken push to main now actually shows red instead of silently
# shipping untested.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest ruff
      - name: Lint (ruff)
        run: ruff check backend
        continue-on-error: true  # tracked separately; don't block merges on pre-existing lint debt yet
      - name: Run backend tests
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Lint
        run: npm run lint
        continue-on-error: true  # tracked separately; don't block merges on pre-existing lint debt yet
