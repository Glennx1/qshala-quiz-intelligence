# Alembic configuration for QShala's backend.
#
# Added under Phase 4 (infra/DevOps priority plan) so a future schema change gets a reviewable,
# versioned, revertible migration instead of silently appending another tuple to the hardcoded
# ALTER TABLE list in app/database.py's ensure_schema_columns(). That function is NOT removed or
# replaced here -- it still runs on every boot and still builds the full schema from scratch on
# a fresh environment (local dev, CI, a brand-new Postgres instance), and every existing
# deployment already has every column it describes. Alembic's job starts from here, for
# whatever changes next -- see alembic/README.md.
#
# One-time setup needed before this is usable against the real production database (can't be
# done from a commit -- see alembic/README.md for the full explanation):
#   cd backend && alembic stamp head
# This marks the live Neon database as already being at the (deliberately no-op) baseline
# revision, WITHOUT running anything against it.

[alembic]
script_location = alembic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
